<script>
(() => {
  'use strict';
  const $ = (q, root = document) => root.querySelector(q);
  const $$ = (q, root = document) => [...root.querySelectorAll(q)];
  const escape = v => String(v == null ? '' : v).replace(/[&<>"']/g, x => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
  const paths = {
    arrow:'M4 12h16M14 6l6 6-6 6', back:'M20 12H4m6-6-6 6 6 6', check:'m5 12 4 4L19 6', close:'m6 6 12 12M6 18 18 6',
    leaf:'M20 3C10 2 3 5 4 13c1 7 12 9 15 0 1-4 1-10 1-10ZM4 21 15 10',
    home:'m3 10 9-7 9 7M5 9v12h14V9M9 21v-7h6v7',
    pin:'M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0ZM15 10a3 3 0 1 1-6 0 3 3 0 0 1 6 0',
    clock:'M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0ZM12 6v6l4 2',
    calendar:'M4 5h16v16H4ZM4 10h16M8 3v4m8-4v4m-9 7h2m4 0h2m-8 4h2',
    user:'M16 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0ZM4 21v-2a8 8 0 0 1 16 0v2',
    shield:'m12 2 8 4v6c0 5-8 10-8 10S4 17 4 12V6l8-4Zm-4 10 3 3 5-6',
    star:'m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9L12 3Z',
    message:'M21 11.5a9 9 0 0 1-9 9 10 10 0 0 1-4-1L3 21l1.5-5A9 9 0 1 1 21 11.5ZM8 8c1 4 3 6 7 7',
    mail:'M3 5h18v14H3Zm0 0 9 8 9-8',
    upload:'M12 16V3m-5 5 5-5 5 5M4 16v5h16v-5',
    sparkle:'m12 2 2.5 7.5L22 12l-7.5 2.5L12 22l-2.5-7.5L2 12l7.5-2.5L12 2Z',
    logout:'M9 4H4v16h5m5-13 5 5-5 5m-6-5h11',
    search:'M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0Zm-2 5 6 6',
    info:'M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0ZM12 11v6m0-10v.1',
    heart:'M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z',
    refresh:'M20 7v5h-5M4 17v-5h5M6 6a8 8 0 0 1 13 1m-1 11a8 8 0 0 1-13-1',
    grid:'M3 3h7v7H3Zm11 0h7v7h-7ZM3 14h7v7H3Zm11 0h7v7h-7Z',
    foot:'M8 12c-4 0-5 3-4 6s5 5 8 2c2-2 1-4-1-5ZM16 3c-2 0-3 3-2 5s4 1 4-1 0-4-2-4ZM8 5v2m-4 1 1 2m15 2v2'
  };
  const icon = name => `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[name] || paths.leaf}"/></svg>`;
  const serviceIcons = {Massage:'leaf', Refleksi:'foot', Lulur:'sparkle', Fisiotherapy:'heart', Creambath:'user'};
  const statusNames = {REQUESTED:'Diajukan',PAID:'Dibayar',PENDING_ADMIN:'Menunggu admin', AWAITING_PAYMENT:'Menunggu pembayaran', CONFIRMED:'Terkonfirmasi', IN_PROGRESS:'Sedang berlangsung', COMPLETED:'Selesai', CANCELLED:'Dibatalkan', PENDING:'Menunggu verifikasi', APPROVED:'Aktif', REJECTED:'Belum disetujui', SUSPENDED:'Dinonaktifkan'};
  const money = n => n === null || n === '' || n === undefined ? 'Konfirmasi ke admin' : new Intl.NumberFormat('id-ID', {style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n);
  const dateLabel = value => new Intl.DateTimeFormat('id-ID',{day:'numeric',month:'long',year:'numeric',timeZone:'Asia/Jakarta'}).format(new Date(value));
  const timeLabel = value => new Intl.DateTimeFormat('id-ID',{hour:'2-digit',minute:'2-digit',hourCycle:'h23',timeZone:'Asia/Jakarta'}).format(new Date(value)).replace('.',':') + ' WIB';
  const localDate = date => new Intl.DateTimeFormat('en-CA',{year:'numeric',month:'2-digit',day:'2-digit',timeZone:'Asia/Jakarta'}).format(date);
  const badge = status => `<span class="status-pill ${escape(status)}">${escape(statusNames[status] || status)}</span>`;
  const notice = (copy, type = '', symbol = 'info') => `<div class="notice ${type}">${icon(symbol)}<div>${copy}</div></div>`;
  // ID ini hanya untuk deduplikasi permintaan, bukan token autentikasi.
  const requestId = () => {
    try { if (window.crypto && typeof window.crypto.randomUUID === 'function') return window.crypto.randomUUID(); } catch (e) {}
    return 'req-' + Date.now() + '-' + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
  };
  const previewFallback = window.MASSAGE_DEMO && $('#app') ? $('#app').innerHTML : '';
  let token = ''; try { token = sessionStorage.getItem('massage_session') || localStorage.getItem('massage_session') || ''; } catch (e) {}
  const state = {config:null,user:null,token,mode:location.hash === '#therapist' ? 'therapist' : location.hash === '#admin' ? 'admin' : 'customer',tab:'new',step:0,epoch:0,
    draft:{serviceId:'',serviceName:'Massage',city:'',area:'',date:localDate(new Date(Date.now()+86400000)),time:'10:00',address:'',notes:'',requestId:requestId()},
    extras:null,extraRequestId:null,quote:null,promoCode:'',therapists:[],selectedTherapist:null,booking:null,bookings:[],therapistData:null,adminData:null,adminTab:'bookings',adminFilter:'',adminSearch:'',rating:0};
  let loginEmail = '', afterLogin = null, toastTimer = null;
  const dialog = $('#dialog');
  function setToken(value,remember=false) { state.token=value;try {sessionStorage.removeItem('massage_session');localStorage.removeItem('massage_session');if(value)(remember?localStorage:sessionStorage).setItem('massage_session',value);}catch(e){try{if(value)sessionStorage.setItem('massage_session',value);}catch(ignore){}} }
  async function rpc(action, data = {}) {
    const payload = Object.assign({}, data, {token:state.token});
    let response;
    if (window.MASSAGE_DEMO) response = await window.MASSAGE_DEMO.api(action,payload);
    else if (window.google && google.script && google.script.run) response = await new Promise((resolve,reject) => google.script.run.withSuccessHandler(resolve).withFailureHandler(() => reject(new Error('Koneksi terputus. Periksa internet lalu coba lagi.'))).api(action,payload));
    else throw new Error('Halaman ini harus dibuka melalui URL Web app Google Apps Script. Untuk pratinjau, buka Pratinjau.html.');
    if (!response || response.ok !== true) {
      if (response && response.code === 'AUTH_REQUIRED') { setToken(''); state.user = null; renderAccount(); }
      const err = new Error(response && response.error || 'Proses belum berhasil. Coba lagi.');
      err.code = response && response.code; throw err;
    }
    return response.data;
  }
  function toast(message, error = false) {
    clearTimeout(toastTimer); const el = $('#toast'); el.textContent = message; el.className = 'toast' + (error ? ' error' : ''); el.hidden = false;
    toastTimer = setTimeout(() => { el.hidden = true; },6000);
  }
  function showError(error) {
    const el = dialog.open ? $('.dialog-error',dialog) : $('#form-error');
    if (el) { el.textContent = error.message; el.setAttribute('role','alert'); }
    toast(error.message,true);
    if (error.code === 'AUTH_REQUIRED') openLogin(() => render());
  }
  function openDialog(title, content) {
    $('#dialog-content').innerHTML = `<div class="dialog-heading"><h2 id="dialog-title">${escape(title)}</h2><button type="button" class="icon-button" data-action="close-dialog" aria-label="Tutup">${icon('close')}</button></div>${content}<div class="dialog-error" role="alert"></div>`;
    if (!dialog.open) dialog.showModal();
  }
  function closeDialog() { dialog.close(); $('#dialog-content').innerHTML = ''; }
  dialog.addEventListener('close', () => { if (!dialog.open) $('#dialog-content').innerHTML = ''; });
  function renderAccount() {
    $('#account-actions').innerHTML = state.user ? `${state.user.isAdmin ? `<button class="icon-button" data-action="mode" data-value="admin" aria-label="Dashboard admin">${icon('grid')}</button>` : ''}<button class="btn btn-text btn-small" data-action="profile" aria-label="Profil akun"><span class="account-avatar">${escape((state.user.name || state.user.email || state.user.username || 'T')[0].toUpperCase())}</span><span class="account-name">${escape(state.user.name || 'Akun saya')}</span></button><button class="icon-button" data-action="logout" aria-label="Keluar">${icon('logout')}</button>` : `<button class="btn btn-outline btn-small" data-action="login">Masuk ${icon('arrow')}</button>`;
    $$('.mode-switch button').forEach(b => { const active = b.dataset.value === state.mode; b.classList.toggle('active',active); b.setAttribute('aria-pressed',String(active)); });
  }
  function intro(title, subtitle, eyebrow = 'HOMECARE MASSAGE · JABODETABEK') {
    return `<div class="intro"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${subtitle}</p></div><div class="quiet-badge">${icon('home')} Perawatan di rumah Anda</div></div>`;
  }
  function aside(therapist = false) {
    return `<aside class="aside"><div class="panel aside-care">${$('#care-artwork').innerHTML}<div class="care-copy"><h2>${therapist ? 'Keahlian Anda,<br>ruang untuk bertumbuh.' : 'Ambil jeda.<br>Biar kami yang datang.'}</h2><p>${therapist ? 'Tentukan area layanan yang nyaman dijangkau. Setiap pesanan dikonfirmasi lebih dulu oleh admin.' : 'Pilih perawatan dan waktu yang nyaman. Admin membantu memastikan therapist dan jadwal Anda.'}</p><button class="btn btn-outline btn-small" data-action="contact">${icon('message')} Tanya admin</button></div></div><div><ul class="assurances"><li>${icon('shield')} ${therapist ? 'Dokumen hanya untuk verifikasi' : 'Therapist melalui verifikasi admin'}</li><li>${icon('pin')} ${therapist ? 'Pilih kecamatan lintas kota / kabupaten' : 'Dicocokkan dengan area layanan'}</li><li>${icon('message')} Konfirmasi personal via WhatsApp</li></ul><div class="aside-bottom"><div class="mini-eyebrow">SELANGKAH LEBIH TENANG</div><div class="mini-flow">Pilih ${icon('arrow')} Konfirmasi ${icon('arrow')} Nikmati</div></div></div></aside>`;
  }
  function customerTabs() { return `<div class="view-tabs"><button class="${state.tab==='new'?'active':''}" data-action="customer-tab" data-value="new">Reservasi baru</button><button class="${state.tab==='history'?'active':''}" data-action="customer-tab" data-value="history">Reservasi saya</button></div>`; }
  function steps() { return `<ol class="steps" aria-label="Tahap reservasi">${['Layanan','Jadwal & area','Therapist','Konfirmasi'].map((label,i) => `<li class="${i===state.step?'current':i<state.step?'done':''}" ${i===state.step?'aria-current="step"':''}><span class="step-number">${i<state.step?icon('check'):i+1}</span><span>${label}</span></li>`).join('')}</ol>`; }
  function chosenService() { return state.config.services.find(s => s.id === state.draft.serviceId); }
  function formError() { return '<div id="form-error" class="error-inline" role="alert"></div>'; }
  function serviceStep() {
    const options = [...new Map(state.config.services.map(s => [s.name,s])).values()];
    if (!options.length) return notice('Layanan belum tersedia. Silakan hubungi admin.');
    const current = chosenService();
    return `<h2>Perawatan apa hari ini?</h2><p class="section-copy">Pilih yang paling tubuh Anda butuhkan.</p><div class="service-grid" role="group" aria-label="Pilihan layanan">${options.map(s => `<button class="service-card ${state.draft.serviceName===s.name?'selected':''}" data-action="service" data-value="${escape(s.name)}" aria-pressed="${state.draft.serviceName===s.name}"><span class="icon-tile">${icon(serviceIcons[s.name])}</span><span><span class="service-name">${escape(s.name)}</span><span class="service-description">${escape(s.description)}</span></span>${state.draft.serviceName===s.name?`<span class="selected-check">${icon('check')}</span>`:''}</button>`).join('')}</div><span class="field-label">Durasi perawatan</span><div class="chips" role="group" aria-label="Durasi layanan">${state.config.services.filter(s => s.name===state.draft.serviceName).map(s => `<button class="choice-chip ${s.id===state.draft.serviceId?'selected':''}" aria-pressed="${s.id===state.draft.serviceId}" data-action="duration" data-value="${escape(s.id)}">${s.id===state.draft.serviceId?icon('check'):''}${s.duration} menit</button>`).join('')}</div>${current&&current.requiresCredential?notice('Pilihan ini hanya menampilkan therapist dengan kompetensi profesional yang telah diperiksa admin.'):''}${formError()}<div class="form-footer"><div class="price-note">${current&&current.price===null?'Harga layanan':'Estimasi layanan'}${priceBlock(current && (current.offer || current),true)}</div><button class="btn" data-action="next-service">Pilih jadwal ${icon('arrow')}</button></div>`;
  }
  function cityOptions(value) { return `<option value="">Pilih kota / kabupaten</option>${Object.keys(state.config.areas).map(c => `<option ${c===value?'selected':''} value="${escape(c)}">${escape(c)}</option>`).join('')}`; }
  function areaOptions(city,value) { return `<option value="">Pilih kecamatan</option>${(state.config.areas[city]||[]).map(a => `<option ${a===value?'selected':''} value="${escape(a)}">${escape(a)}</option>`).join('')}`; }
  function scheduleStep() {
    const d = state.draft, service = chosenService(), times = [];
    for (let m=state.config.openHour*60;m+(service?service.duration:60)<=state.config.closeHour*60;m+=30) times.push(String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'));
    if (!times.includes(d.time)) d.time = times[0];
    return `<h2>Kami datang ke mana?</h2><p class="section-copy">Pilih kecamatan sesuai alamat layanan. Pilihan therapist dicocokkan dengan cakupan layanan dan waktu ini.</p><form id="schedule-form"><div class="field-row"><label class="field"><span>Kota / kabupaten</span><select id="booking-city" name="city" required>${cityOptions(d.city)}</select></label><label class="field"><span>Kecamatan</span><select id="booking-area" name="area" required ${!d.city?'disabled':''}>${areaOptions(d.city,d.area)}</select></label></div><div class="field-row"><label class="field"><span>Tanggal</span><input type="date" name="date" value="${escape(d.date)}" min="${localDate(new Date())}" max="${localDate(new Date(Date.now()+state.config.maxBookingDays*86400000))}" required></label><label class="field"><span>Jam mulai · WIB</span><select name="time" required>${times.map(t => `<option ${t===d.time?'selected':''}>${t}</option>`).join('')}</select></label></div><label class="field"><span>Alamat lengkap</span><textarea name="address" placeholder="Nama jalan, nomor rumah, RT/RW, kelurahan, dan patokan" minlength="10" maxlength="600" required autocomplete="street-address">${escape(d.address)}</textarea></label><label class="field"><span>Catatan untuk admin <span class="muted">(opsional)</span></span><textarea name="notes" rows="2" maxlength="600" placeholder="Misalnya: akses parkir atau perlengkapan yang perlu dikonfirmasi.">${escape(d.notes)}</textarea></label>${notice('Pesan minimal '+state.config.minNoticeMinutes/60+' jam sebelumnya. Pilihan therapist tetap menunggu konfirmasi kesediaan oleh admin.','', 'clock')}${formError()}<div class="form-footer"><button class="btn btn-text" type="button" data-action="back">${icon('back')} Kembali</button><button class="btn" type="submit">Cari therapist ${icon('search')}</button></div></form>`;
  }
  function therapistStep() {
    const d = state.draft;
    return `<h2>Therapist untuk Anda</h2><p class="section-copy">${escape(d.area)}, ${escape(d.city)} · ${dateLabel(d.date+'T12:00:00+07:00')} · ${escape(d.time)} WIB</p>${state.therapists.length ? `<div class="notice success">${icon('pin')}<span>${state.therapists.length} therapist melayani area dan perawatan pilihan Anda.</span></div><div class="therapist-list">${state.therapists.map(t => `<article class="therapist-card ${state.selectedTherapist&&state.selectedTherapist.id===t.id?'selected':''}"><div class="avatar" aria-hidden="true">${escape(t.name.split(' ').map(x=>x[0]).slice(0,2).join(''))}</div><div><div class="therapist-title"><div><h3>${escape(t.name)}</h3><span class="small muted">${(t.coverage||[]).length} kecamatan layanan</span></div><span class="rating">${icon('star')} ${t.rating===null?'Baru':Number(t.rating).toFixed(1)} ${t.reviewCount?'('+t.reviewCount+')':''}</span></div><p>${escape(t.experience)}</p><div>${t.skills.map(s=>`<span class="tag">${escape(s)}</span>`).join('')}</div><div class="card-actions"><button class="text-button" data-action="reviews" data-id="${escape(t.id)}">Lihat review</button><button class="btn ${state.selectedTherapist&&state.selectedTherapist.id===t.id?'btn-tonal':'btn-outline'} btn-small" data-action="select-therapist" data-id="${escape(t.id)}" aria-pressed="${!!(state.selectedTherapist&&state.selectedTherapist.id===t.id)}">${state.selectedTherapist&&state.selectedTherapist.id===t.id?icon('check')+' Dipilih':'Pilih therapist'}</button></div></div></article>`).join('')}</div>` : `<div class="empty-state"><div class="icon-tile">${icon('search')}</div><h3>Belum ada yang cocok</h3><p>Belum ada therapist aktif untuk kombinasi area, layanan, dan waktu ini. Coba jadwal lain, atau minta bantuan admin.</p><button class="btn btn-outline" data-action="contact">${icon('message')} Tanya admin</button></div>`}${formError()}<div class="form-footer"><button class="btn btn-text" data-action="back">${icon('back')} Ubah jadwal</button>${state.therapists.length?`<button class="btn" data-action="next-therapist" ${!state.selectedTherapist?'disabled':''}>Lanjut ${icon('arrow')}</button>`:''}</div>`;
  }
  function summaryRows(rows) { return `<dl class="summary-list">${rows.map(([k,v])=>`<div><dt>${escape(k)}</dt><dd>${escape(v)}</dd></div>`).join('')}</dl>`; }
  function confirmStep() {
    const d=state.draft,s=chosenService(),t=state.selectedTherapist;
    return `<h2>Satu langkah menuju waktu tenang</h2><p class="section-copy">Periksa detailnya sebelum menghubungi admin.</p>${summaryRows([['Customer',state.user.name],['WhatsApp','+'+state.user.whatsapp],['Layanan',s.name+' · '+s.duration+' menit'],['Therapist',t.name],['Jadwal',dateLabel(d.date+'T12:00:00+07:00')+' · '+d.time+' WIB'],['Lokasi',d.area+', '+d.city],['Alamat',d.address],...(d.notes?[['Catatan',d.notes]]:[]),['Estimasi',money(state.quote ? state.quote.price : s.price)]])}${priceBlock(state.quote || s)}<form id="promo-code-form"><label class="field"><span>Kode promo (opsional)</span><input name="promoCode" value="${escape(state.promoCode)}" maxlength="30" placeholder="Contoh: SEPTEMBER"></label><button type="submit" class="btn btn-outline btn-small">Terapkan / cek harga</button><button type="button" class="btn btn-text btn-small" data-action="remove-promo">Gunakan promo otomatis</button></form>${notice('Reservasi belum terkonfirmasi. Admin akan mengecek kesediaan therapist, lalu mengirim total dan petunjuk pembayaran melalui WhatsApp.')}<form id="booking-confirm-form"><label class="check-line"><input type="checkbox" name="consent" required><span>Saya menyetujui <button type="button" class="text-button" data-action="privacy">ketentuan reservasi</button> dan penggunaan data untuk layanan ini.</span></label>${formError()}<div class="form-footer"><button class="btn btn-text" type="button" data-action="back">${icon('back')} Kembali</button><button class="btn" type="submit">Simpan & ke WhatsApp ${icon('message')}</button></div></form>`;
  }
  function successStep() {
    const b=state.booking;
    return `<div class="success-heading"><div class="success-circle">${icon('check')}</div><div class="eyebrow">RESERVASI TERSIMPAN</div><h2>Tinggal konfirmasi ke admin.</h2><p>Kirim detail reservasi melalui WhatsApp.<br>Admin akan membantu memastikan therapist dan jadwalnya.</p>${badge(b.status)}</div>${summaryRows([['Kode',b.id],['Perawatan',b.serviceName+' · '+b.duration+' menit'],['Therapist',b.therapistName],['Jadwal',dateLabel(b.startAt)+' · '+timeLabel(b.startAt)],['Area',b.area+', '+b.city]])}${priceBlock(b)}${invoiceButton(b)}<a class="btn btn-full" href="${escape(b.whatsappUrl)}" target="_blank" rel="noopener noreferrer">${icon('message')} Buka WhatsApp admin</a><p class="form-hint" style="text-align:center;margin-top:12px">Jika tab WhatsApp tidak terbuka otomatis, gunakan tombol di atas. Pesan baru terkirim setelah Anda menekan kirim di WhatsApp.</p><div class="card-actions"><button class="text-button" data-action="customer-tab" data-value="history">Lihat reservasi saya</button><button class="text-button" data-action="new-booking">Buat reservasi lain</button></div>`;
  }
  function loginPrompt(title,desc) { return `<div class="login-intro"><div class="icon-tile">${icon('user')}</div><h2>${title}</h2><p class="section-copy">${desc}</p><button class="btn" data-action="login">Masuk dengan email ${icon('arrow')}</button></div>`; }
  function bookingCard(b) {
    return `<article class="booking-card"><div class="booking-top"><div><div class="booking-code">${escape(b.id)}</div><h3>${escape(b.serviceName)} · ${b.duration} menit</h3><span class="small muted">${escape(b.therapistName || '')}</span></div>${badge(b.status)}</div><div class="booking-details"><span>${icon('calendar')}${dateLabel(b.startAt)}</span><span>${icon('clock')}${timeLabel(b.startAt)}</span><span>${icon('pin')}${escape(b.area)}</span></div>${priceBlock(b)}${invoiceButton(b)}<div class="card-actions">${b.whatsappUrl?`<a class="btn btn-outline btn-small" href="${escape(b.whatsappUrl)}" target="_blank" rel="noopener noreferrer">${icon('message')} Hubungi admin</a>`:''}${b.status==='PENDING_ADMIN'?`<button class="text-button" data-action="cancel-booking" data-id="${escape(b.id)}">Batalkan</button>`:''}${b.status==='COMPLETED'&&!b.reviewed?`<button class="btn btn-tonal btn-small" data-action="review" data-id="${escape(b.id)}">${icon('star')} Beri review</button>`:b.reviewed?'<span class="small muted">Review terkirim</span>':''}</div></article>`;
  }
  function historyContent() { return `<div class="section-heading"><h2>Reservasi saya</h2><button class="icon-button" data-action="refresh" aria-label="Muat ulang reservasi">${icon('refresh')}</button></div>${state.bookings.length?state.bookings.map(bookingCard).join(''):`<div class="empty-state"><div class="icon-tile">${icon('calendar')}</div><h3>Belum ada reservasi</h3><p>Saat Anda membuat reservasi, detail dan perkembangannya muncul di sini.</p><button class="btn btn-tonal" data-action="customer-tab" data-value="new">Pilih perawatan ${icon('arrow')}</button></div>`}`; }
  async function render() {
    const epoch=++state.epoch; renderAccount();
    if (!state.config.configured) { $('#app').innerHTML=intro('Segera menemani<br><em>waktu tenang Anda.</em>','Website sedang disiapkan.')+notice('Admin perlu melengkapi konfigurasi dan menjalankan setupApp_ sebelum menerima pendaftaran atau reservasi.'); return; }
    if (state.mode==='customer') {
      $('#app').innerHTML='<div id="promo-highlights">'+highlightBanner()+'</div>'+intro('Waktu tenang,<br><em>di rumah sendiri.</em>','Pilih perawatan, temukan therapist, dan nikmati jeda Anda.')+`<div class="workspace"><section class="panel">${customerTabs()}<div id="customer-content" class="animate-in"></div></section>${aside()}</div>`;
      const target=$('#customer-content');
      if (state.tab==='history') {

    }

  function filterCoverage(picker,value) {

  function renderAdminList() {
    if(['promos','services','additions'].includes(state.adminTab))return;
    const rows=state.adminData[state.adminTab].filter(x=>(!state.adminFilter||x.status===state.adminFilter)&&(!state.adminSearch||[x.id,x.fullName,x.customerName,x.therapistName,x.city,x.area].join(' ').toLowerCase().includes(state.adminSearch.toLowerCase())));
    $('#admin-list').innerHTML=rows.length?`<div class="${state.adminTab==='therapists'?'admin-grid':''}">${rows.map(state.adminTab==='bookings'?adminBookingCard:adminTherapistCard).join('')}</div>`:'<div class="empty-state"><h3>Belum ada data yang sesuai</h3><p>Pendaftaran dan reservasi baru akan muncul di sini.</p></div>';
  }
  function adminBookingCard(b) {
    const next={PENDING_ADMIN:'AWAITING_PAYMENT',AWAITING_PAYMENT:'CONFIRMED',CONFIRMED:'IN_PROGRESS',IN_PROGRESS:'COMPLETED'}[b.status];
    const nextLabel={AWAITING_PAYMENT:'Therapist setuju → minta pembayaran',CONFIRMED:'Pembayaran diterima → konfirmasi',IN_PROGRESS:'Mulai layanan',COMPLETED:'Tandai selesai'};
    return `<article class="admin-item" data-booking="${escape(b.id)}"><div class="booking-top"><div><div class="booking-code">${escape(b.id)}</div><h3>${escape(b.customerName)} · ${escape(b.serviceName)}</h3><span class="small muted">Therapist: ${escape(b.therapistName)}</span></div>${badge(b.status)}</div><div class="booking-details"><span>${icon('calendar')}${dateLabel(b.startAt)}</span><span>${icon('clock')}${timeLabel(b.startAt)}</span><span>${icon('pin')}${escape(b.area)}, ${escape(b.city)}</span><span>${b.duration} menit · ${money(b.price)}</span></div>${priceBlock(b)}${b.invoice?summaryRows([['Total tagihan',money(b.invoice.total)],['Pembayaran tercatat',money(b.invoice.received)],['Sisa pembayaran',money(b.invoice.balance)],['Refund perlu diselesaikan',money(b.invoice.refundDue)]]):''}<div class="chips">${invoiceButton(b)}${b.price===null&&['PENDING_ADMIN','AWAITING_PAYMENT'].includes(b.status)?`<button class="btn btn-outline btn-small" data-action="base-invoice" data-id="${escape(b.id)}" data-value="price">Tetapkan harga awal</button>`:''}${b.price===null&&['CONFIRMED','IN_PROGRESS','COMPLETED','CANCELLED'].includes(b.status)?`<button class="btn btn-outline btn-small" data-action="base-invoice" data-id="${escape(b.id)}" data-value="legacyPayment">Catat pembayaran lama</button>`:''}${b.status==='CANCELLED'&&b.invoice&&b.invoice.refundDue>0?`<button class="btn btn-outline btn-small" data-action="base-invoice" data-id="${escape(b.id)}" data-value="refund">Refund layanan awal</button>`:''}</div><p>${escape(b.address)}</p>${b.notes?`<p class="muted">Catatan customer: ${escape(b.notes)}</p>`:''}<div class="card-actions"><div class="chips">${b.therapistUrl?`<a class="btn btn-outline btn-small" href="${escape(b.therapistUrl)}" target="_blank" rel="noopener noreferrer">${icon('message')} Chat therapist</a>`:''}<a class="btn btn-tonal btn-small" href="${escape(b.customerUrl)}" target="_blank" rel="noopener noreferrer">Chat customer</a></div></div>${next?`<label class="field"><span>Catatan admin</span><textarea class="admin-note" maxlength="600" rows="2" placeholder="Catatan konfirmasi atau alasan pembatalan">${escape(b.adminNote)}</textarea></label>${b.status==='PENDING_ADMIN'?'<label class="check-line"><input type="checkbox" class="therapist-confirmed"><span>Therapist telah menyetujui tanggal dan jam via WhatsApp.</span></label>':''}${b.status==='AWAITING_PAYMENT'?'<label class="check-line"><input type="checkbox" class="payment-confirmed"><span>Pembayaran customer benar-benar sudah diterima.</span></label>':''}<div class="card-actions"><button class="btn btn-small" data-action="admin-booking-status" data-id="${escape(b.id)}" data-status="${next}">${nextLabel[next]}</button>${b.status!=='IN_PROGRESS'?`<button class="text-button" data-action="admin-cancel" data-id="${escape(b.id)}">Batalkan reservasi</button>`:''}</div>`:b.adminNote?`<p class="small muted">Catatan admin: ${escape(b.adminNote)}</p>`:''}</article>`;
  }
  function adminTherapistCard(t) {
    return `<article class="admin-item" data-therapist="${escape(t.id)}"><div class="booking-top"><div><div class="booking-code">${escape(t.id)}</div><h3>${escape(t.fullName)}</h3></div>${badge(t.status)}</div><p class="small">Username: <strong>${escape(t.loginUsername||'Belum diatur')}</strong> · ${t.passwordReady?'Password tersedia':'Password belum diatur'}</p><div class="card-actions"><button class="btn btn-outline btn-small" data-action="therapist-access" data-id="${escape(t.id)}">Atur username / password</button><button class="text-button" data-action="therapist-edit-profile" data-id="${escape(t.id)}">Bantu lengkapi profil</button></div>${partnershipCard(t,true)}${skillReview(t)}<p>${escape(t.experience)}</p><p class="small muted">${escape(coverageText(t))}${!(t.coverage||[]).length&&t.city?' · Cakupan lama: '+escape(t.city)+' / '+escape((t.areas||[]).join(', ')):''}</p><div>${t.skills.map(s=>`<span class="tag">${escape(s)}</span>`).join('')}</div><div class="card-actions"><button class="btn btn-outline btn-small" data-action="ktp" data-id="${escape(t.id)}">${icon('shield')} Lihat KTP</button><a class="text-button" href="${escape(t.contactUrl)}" target="_blank" rel="noopener noreferrer">Chat therapist</a></div><label class="field"><span>Catatan / alasan</span><textarea class="admin-note" maxlength="600" rows="2">${escape(t.adminNote)}</textarea></label><label class="check-line"><input type="checkbox" class="identity-checked"><span>Saya telah memeriksa KTP dan identitas pendaftar.</span></label>${(state.adminData.catalog||state.config.services).some(s=>s.requiresCredential&&t.skills.includes(s.skill||s.name))?`<label class="check-line"><input type="checkbox" class="physio-verified" ${t.physioVerified?'checked':''}><span>Bukti kompetensi dan izin praktik yang diperlukan sudah diperiksa (termasuk STR/SIP untuk Fisiotherapy).</span></label>`:''}<div class="chips"><button class="btn btn-small" data-action="admin-therapist-status" data-id="${escape(t.id)}" data-status="APPROVED">${t.status==='APPROVED'?'Simpan kompetensi':'Aktifkan'}</button><button class="btn btn-outline btn-small" data-action="admin-therapist-status" data-id="${escape(t.id)}" data-status="${t.status==='APPROVED'?'SUSPENDED':'REJECTED'}">${t.status==='APPROVED'?'Nonaktifkan':'Tolak'}</button></div></article>`;
  }

  function priceBlock(q, catalog=false) {
    if(!q)return '';
    const discounted=Number(q.discount)>0;
    return `<div class="promo-price">${discounted?`<span class="small muted">Harga normal <s>${money(q.normalPrice)}</s></span><strong>${money(q.price)}</strong><span class="tag">${escape(q.promoName)}</span><span class="small">Hemat ${money(q.discount)}${q.promoCode?' · Kode '+escape(q.promoCode):''}</span>${catalog||q.promoEndsAt?`<span class="small muted">Pemesanan: ${dateLabel(q.promoStartsAt)} ${timeLabel(q.promoStartsAt)} – ${dateLabel(q.promoEndsAt)} ${timeLabel(q.promoEndsAt)} (sebelum waktu akhir).</span>`:''}${q.serviceFrom||q.serviceTo?`<span class="small muted">Jadwal layanan: ${q.serviceFrom?dateLabel(q.serviceFrom)+' '+timeLabel(q.serviceFrom):'tanpa batas awal'} – ${q.serviceTo?dateLabel(q.serviceTo)+' '+timeLabel(q.serviceTo):'tanpa batas akhir'}.</span>`:''}${catalog?'<span class="small muted">Sesuai jadwal, kuota, dan batas pemakaian akun. Harga diperiksa kembali saat konfirmasi.</span>':''}`:`<strong>${money(q.price)}</strong>`}</div>`;
  }
  function promoDashboard(data) {
    const promos=data.promos || [];
    return `${adminNav()}<div class="section-heading"><div><h2>Promo layanan</h2><p class="section-copy">Harga normal tetap. Atur potongan dan periode dalam WIB.</p></div><button class="btn btn-small" data-action="promo-new">Tambah promo</button></div>${notice('Promo otomatis memilih potongan terbesar yang memenuhi syarat. Kode promo menggantikan promo otomatis, bukan ditumpuk. Kuota dihitung saat reservasi dibuat dan tidak dikembalikan saat dibatalkan. Harga normal diatur pada tab Services di database.')}<div class="promo-list">${promos.length?promos.map(p=>{const status=!p.active?'Nonaktif':Date.now()<+new Date(p.startsAt)?'Terjadwal':Date.now()>=+new Date(p.endsAt)?'Berakhir':p.totalLimit!==''&&p.used>=Number(p.totalLimit)?'Kuota habis':'Aktif';return `<article class="admin-item"><div class="booking-top"><h3>${escape(p.name)}</h3><span class="tag">${status}</span></div><p>${p.discountType==='PERCENT'?escape(p.value)+'%':money(p.value)} · ${p.mode==='AUTO'?'Otomatis':'Kode '+escape(p.code)}</p><p class="small">${dateLabel(p.startsAt)} ${timeLabel(p.startsAt)} – ${dateLabel(p.endsAt)} ${timeLabel(p.endsAt)}</p><p class="small muted">${p.serviceIds.map(id=>{const v=data.services.find(s=>s.id===id);return escape(v?v.name+' '+v.duration+' menit':id);}).join(', ')}</p><p class="small">Terpakai ${p.used || 0}${p.totalLimit!==''?' / '+escape(p.totalLimit):' · tanpa kuota total'} · Per customer: ${p.perCustomerLimit || 'tanpa batas'}</p><div class="chips"><button class="btn btn-outline btn-small" data-action="promo-edit" data-id="${escape(p.id)}">Edit</button><button class="btn btn-tonal btn-small" data-action="promo-toggle" data-id="${escape(p.id)}">${p.active?'Nonaktifkan':'Aktifkan'}</button></div></article>`;}).join(''):notice('Belum ada promo. Tambahkan promo bulanan pertama Anda.')}</div>`;
  }
  function editPromo(p={}) {
    const wib=v=>v?new Date(+new Date(v)+7*3600000).toISOString().slice(0,16):'';
    const input=(name,label,type='text',value='',extra='')=>`<label class="field"><span>${label}</span><input name="${name}" type="${type}" value="${escape(value)}" ${extra}></label>`;
    openDialog(p.id?'Edit promo':'Tambah promo',`<form id="promo-form" data-id="${escape(p.id || '')}">${input('name','Nama promo','text',p.name || '', 'required minlength="3" maxlength="80"')}<div class="field-row"><label class="field"><span>Cara penggunaan</span><select name="mode"><option value="AUTO">Otomatis</option><option value="CODE" ${p.mode==='CODE'?'selected':''}>Kode promo</option></select></label>${input('code','Kode (wajib untuk mode kode)','text',p.code || '', 'maxlength="30" pattern="[A-Za-z0-9_-]{3,30}"')}</div><div class="field-row"><label class="field"><span>Jenis diskon</span><select name="discountType"><option value="PERCENT">Persentase (%)</option><option value="FIXED" ${p.discountType==='FIXED'?'selected':''}>Potongan rupiah</option></select></label>${input('value','Nilai diskon','number',p.value || '', 'required min="1" step="1"')}</div><fieldset><legend>Layanan & durasi</legend><div class="check-group">${state.adminData.services.map(s=>`<label class="check-option"><input type="checkbox" name="serviceIds" value="${escape(s.id)}" ${(p.serviceIds || []).includes(s.id)?'checked':''}><span>${escape(s.name)} ${s.duration} menit · ${money(s.price)}</span></label>`).join('')}</div></fieldset><div class="field-row">${input('startsAt','Mulai pemesanan · WIB','datetime-local',wib(p.startsAt),'required')}${input('endsAt','Akhir pemesanan · WIB (eksklusif)','datetime-local',wib(p.endsAt),'required')}</div><p class="form-hint">Contoh promo September: 1 September 00:00 hingga 1 Oktober 00:00. Tanggal akhir tidak termasuk.</p><div class="field-row">${input('serviceFrom','Mulai jadwal layanan · opsional','datetime-local',wib(p.serviceFrom))}${input('serviceTo','Akhir jadwal layanan · opsional','datetime-local',wib(p.serviceTo))}</div><div class="field-row">${input('totalLimit','Kuota total · kosong = tanpa batas','number',p.totalLimit || '', 'min="1" max="1000000" step="1"')}${input('perCustomerLimit','Batas per customer · opsional','number',p.perCustomerLimit || '', 'min="1" max="1000000" step="1"')}</div><label class="check-line"><input type="checkbox" name="active" ${p.active!==false?'checked':''}><span>Aktifkan sesuai periode</span></label><label class="check-line"><input type="checkbox" name="highlight" ${p.highlight===true||String(p.highlight).toLowerCase()==='true'?'checked':''}><span>Tampilkan banner highlight customer</span></label>${input('highlightOrder','Urutan banner (angka kecil tampil dahulu)','number',p.highlightOrder||0,'min="0" max="999" step="1"')}<p class="form-hint">Gunakan harga normal yang benar-benar berlaku. Reservasi lama tetap memakai harga saat dibuat.</p><button class="btn btn-full" type="submit">Simpan promo</button></form>`);
  }

    function adminNav() {

  function highlightBanner() {

    return promos.length?`<section class="highlights" aria-label="Promo yang sedang berlangsung">${promos.map(p=>`<article class="highlight-card"><span class="eyebrow">WAKTUNYA MERAWAT DIRI</span><h2>${escape(p.name)}</h2><p class="highlight-value">${p.discountType==='PERCENT'?'Hemat '+Number(p.value)+'%':'Potongan hingga '+money(p.value)}</p><p class="small">Pemesanan sampai ${dateLabel(p.endsAt)} ${timeLabel(p.endsAt)} (sebelum waktu akhir).</p><p class="small muted">${p.mode==='AUTO'?'Otomatis sesuai syarat.':'Gunakan kode '+escape(p.code)+'.'} Berlaku pada layanan tertentu, sesuai kuota dan jadwal.</p><div class="chips"><button class="btn btn-small" data-action="highlight-service" data-id="${escape(p.id)}">Lihat layanan ${icon('arrow')}</button>${p.mode==='CODE'?`<button class="btn btn-outline btn-small" data-action="copy-promo" data-code="${escape(p.code)}">Salin kode</button>`:''}</div></article>`).join('')}</section>`:'';

  function catalogDashboard(data) {

  function editService(s={}) {
    openDialog(s.id?'Edit layanan':'Tambah layanan',`<form id="service-admin-form" data-id="${escape(s.id||'')}"><label class="field"><span>Nama layanan</span><input name="name" value="${escape(s.name||'')}" minlength="2" maxlength="80" required></label><div class="field-row"><label class="field"><span>Durasi per sesi · menit</span><input name="duration" type="number" min="5" max="240" step="1" value="${s.duration||30}" required></label><label class="field"><span>Harga normal · rupiah</span><input name="price" type="number" min="0" max="100000000" step="1" value="${s.price===null?'':s.price===undefined?'':s.price}" placeholder="Kosong = konfirmasi admin"></label></div><label class="field"><span>Jenis penggunaan</span><select name="kind">${[['MAIN','Layanan utama'],['ADDON','Layanan tambahan'],['BOTH','Utama & tambahan']].map(([v,l])=>`<option value="${v}" ${(s.kind||'BOTH')===v?'selected':''}>${l}</option>`).join('')}</select></label><label class="field"><span>Keahlian yang diperlukan</span><input name="skill" list="skill-options" value="${escape(s.skill||s.name||'')}" ${s.id?'readonly':''} minlength="2" maxlength="80" required><datalist id="skill-options">${state.config.skills.map(k=>`<option value="${escape(k)}"></option>`).join('')}</datalist><small>Pilih keahlian yang sudah ada atau ketik keahlian baru. Setelah disimpan, keahlian penghubung tidak bisa diganti.</small></label><label class="field"><span>Deskripsi</span><textarea name="description" maxlength="600">${escape(s.description||'')}</textarea></label><label class="check-line"><input name="active" type="checkbox" ${s.active!==false?'checked':''}><span>Aktifkan layanan</span></label><label class="check-line"><input name="requiresCredential" type="checkbox" ${s.requiresCredential?'checked':''}><span>Wajib bukti kompetensi khusus</span></label><button class="btn btn-full" type="submit">Simpan layanan</button></form>`);

  function renderInvoice() {
    const d=state.extras,b=d.booking,sum=d.summary,admin=d.role==='ADMIN';
    openDialog('Tagihan '+b.id,`<button class="btn btn-text btn-small" data-action="invoice" data-id="${escape(b.id)}">${icon('refresh')} Muat ulang tagihan</button><p class="dialog-copy">${escape(b.serviceName)} · ${escape(statusNames[b.status]||b.status)}<br>Perkiraan selesai: ${dateLabel(b.endAt)} ${timeLabel(b.endAt)}</p>${summaryRows([['Layanan awal',money(sum.base)],['Tambahan disetujui',money(sum.extras)],['Total tagihan',money(sum.total)],['Pembayaran tercatat',money(sum.received)],['Refund tercatat',money(sum.refunded)],['Sisa pembayaran',money(sum.balance)],['Refund perlu diselesaikan',money(sum.refundDue)]])}${sum.unknownBasePayment?notice('Nominal pembayaran awal lama belum tercatat. Admin perlu melengkapinya agar total akurat.'):''}${revenuePanel(d)}${d.canRequest?`<details class="addon-request"><summary>Ajukan layanan tambahan</summary><p class="small muted">Tersedia sesuai keahlian therapist. Harga dan durasi per sesi; belum menjadi tagihan sebelum disetujui admin.</p>${d.services.length?`<form id="addon-request-form"><label class="field"><span>Layanan tambahan</span><select name="serviceId" required>${d.services.map(s=>`<option value="${escape(s.id)}">${escape(s.name)} · ${s.duration} menit · ${money(s.price)}</option>`).join('')}</select></label><label class="field"><span>Jumlah sesi</span><input type="number" name="quantity" value="1" min="1" max="5" step="1" required></label><label class="field"><span>Catatan permintaan</span><textarea name="note" maxlength="600"></textarea></label>${d.role==='THERAPIST'?'<label class="check-line"><input name="customerRequested" type="checkbox" required><span>Tambahan ini diminta oleh customer.</span></label>':''}<button type="submit" class="btn btn-full">Ajukan ke admin</button></form>`:notice('Belum ada layanan tambahan dengan harga dan keahlian yang sesuai. Hubungi admin.')}</details>`:''}<div class="invoice-items">${d.addons.length?d.addons.map(a=>addonCard(a,admin)).join(''):notice('Belum ada tagihan tambahan.')}</div><p class="form-hint">Permintaan belum merupakan persetujuan customer. Bayar setelah konfirmasi admin melalui WhatsApp. Refund dicatat setelah transfer di luar website.</p>`);

  async function passwordProof(password,salt){
    if(!globalThis.crypto||!crypto.subtle)throw new Error('Buka website melalui URL HTTPS /exec di Safari atau Chrome terbaru.');
    const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveBits']);
    const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(salt),iterations:600000,hash:'SHA-256'},key,256);
    return Array.from(new Uint8Array(bits),b=>b.toString(16).padStart(2,'0')).join('');
  }

  async function prepareKtp(file) {
    if(!file || !['image/jpeg','image/png'].includes(file.type)) throw new Error('Pilih foto JPG atau PNG. Jika foto HEIC, ekspor sebagai JPG terlebih dahulu.');
    if(file.size>15*1024*1024) throw new Error('Foto sumber terlalu besar. Pilih foto di bawah 15 MB.');
    let data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(new Error('Foto tidak dapat dibaca.'));reader.readAsDataURL(file);});
    const img=await new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=()=>reject(new Error('Foto rusak atau format tidak didukung.'));im.src=data;});
    const scale=Math.min(1,1800/Math.max(img.naturalWidth,img.naturalHeight));
    if(scale<1||file.size>2*1024*1024){
      const canvas=document.createElement('canvas');canvas.width=Math.round(img.naturalWidth*scale);canvas.height=Math.round(img.naturalHeight*scale);
      const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);
      data=canvas.toDataURL('image/jpeg',.9);
      if(data.split(',')[1].length*3/4>2*1024*1024)data=canvas.toDataURL('image/jpeg',.78);
    }
    const base64=data.split(',')[1],mime=data.slice(5,data.indexOf(';'));
    if(base64.length*3/4>2*1024*1024)throw new Error('Foto masih di atas 2 MB. Kurangi ukuran dan upload ulang.');
    return {base64,mime};
  }

    'reviews':async b=>{openDialog('Review customer','<div class="loading-surface"><span class="spinner"></span> Memuat review…</div>');const data=await rpc('getReviews',{therapistId:b.dataset.id});if(!dialog.open)return;openDialog('Review customer',data.length?data.map(r=>`<article class="review-card"><div class="therapist-title"><strong>${escape(r.customerLabel)}</strong><span class="rating">${icon('star')} ${r.rating}/5</span></div><p>${escape(r.comment)}</p><span class="small muted">${dateLabel(r.createdAt)}</span></article>`).join(''):'<div class="empty-state"><h3>Belum ada review</h3><p>Review akan muncul setelah customer menyelesaikan layanan.</p></div>');},
    'cancel-booking':b=>{openDialog('Batalkan reservasi?',`<p class="dialog-copy">Reservasi ${escape(b.dataset.id)} akan dibatalkan. Anda dapat membuat reservasi baru kapan saja.</p><div class="card-actions"><button class="btn btn-outline" data-action="close-dialog">Kembali</button><button class="btn btn-danger" data-action="confirm-cancel" data-id="${escape(b.dataset.id)}">Ya, batalkan</button></div>`);},
    'confirm-cancel':async b=>{await rpc('cancelBooking',{bookingId:b.dataset.id});closeDialog();await render();toast('Reservasi dibatalkan.');},
    'review':b=>{state.rating=0;openDialog('Bagaimana perawatannya?',`<p class="dialog-copy">Bagikan pengalaman Anda. Review membantu customer lain memilih therapist.</p><form id="review-form" data-id="${escape(b.dataset.id)}"><div class="rating-input" role="group" aria-label="Rating 1 sampai 5">${[1,2,3,4,5].map(n=>`<button type="button" class="star-btn" data-action="star" data-value="${n}" aria-label="${n} bintang" aria-pressed="false">${icon('star')}</button>`).join('')}</div><label class="field"><span>Review Anda</span><textarea name="comment" minlength="5" maxlength="1000" required placeholder="Apa yang Anda sukai? Apa yang bisa ditingkatkan?"></textarea></label><p class="form-hint">Nama Anda disamarkan. Hindari menyertakan data pribadi.</p><button class="btn btn-full" type="submit">Kirim review ${icon('star')}</button></form>`);},
    'star':b=>{state.rating=Number(b.dataset.value);$$('.star-btn').forEach(x=>{x.classList.toggle('selected',Number(x.dataset.value)<=state.rating);x.setAttribute('aria-pressed',String(Number(x.dataset.value)===state.rating));});},
    'admin-tab':async b=>{state.adminTab=b.dataset.value;state.adminFilter='';state.adminSearch='';$('#admin-content').innerHTML=adminDashboard(state.adminData);renderAdminList();},
    'ktp':async b=>{openDialog('Dokumen KTP · privat','<div class="loading-surface"><span class="spinner"></span> Memuat dokumen…</div>');const data=await rpc('adminKtp',{therapistId:b.dataset.id});if(!dialog.open)return;openDialog('Dokumen KTP · privat',`<p class="dialog-copy">Gunakan hanya untuk pemeriksaan identitas. Akses dokumen tercatat.</p><img class="ktp-image" alt="Foto KTP pendaftar untuk verifikasi admin" src="data:${escape(data.mime)};base64,${escape(data.base64)}"><button class="btn btn-outline btn-full" data-action="close-dialog">Tutup dokumen</button>`);},
    'admin-therapist-status':async b=>{const t=state.adminData.therapists.find(x=>x.id===b.dataset.id);if(b.dataset.status==='APPROVED'&&!(t.partnership&&t.partnership.ready)){await openVerification(t.id);return;}const card=b.closest('[data-therapist]');await rpc('adminTherapist',{therapistId:b.dataset.id,status:b.dataset.status,note:$('.admin-note',card).value,identityChecked:$('.identity-checked',card).checked,physioVerified:!!($('.physio-verified',card)&&$('.physio-verified',card).checked)});await render();toast('Status therapist diperbarui.');},
    'admin-booking-status':async b=>{const card=b.closest('[data-booking]');await rpc('adminBooking',{bookingId:b.dataset.id,status:b.dataset.status,note:$('.admin-note',card).value,therapistConfirmed:!!($('.therapist-confirmed',card)&&$('.therapist-confirmed',card).checked),paymentConfirmed:!!($('.payment-confirmed',card)&&$('.payment-confirmed',card).checked)});await render();toast('Status reservasi diperbarui.');},
    'admin-cancel':b=>{const note=$('.admin-note',b.closest('[data-booking]')).value;if(note.trim().length<5)throw new Error('Isi alasan pembatalan di catatan admin terlebih dahulu.');openDialog('Batalkan reservasi?',`<p class="dialog-copy">${escape(b.dataset.id)}<br>${escape(note)}</p><p class="small muted">Pastikan customer dan therapist sudah diberi tahu. Pengembalian pembayaran, bila ada, ditangani di luar website.</p><button class="btn btn-danger btn-full" data-action="admin-confirm-cancel" data-id="${escape(b.dataset.id)}" data-note="${escape(note)}">Konfirmasi pembatalan</button>`);},
    'admin-confirm-cancel':async b=>{await rpc('adminBooking',{bookingId:b.dataset.id,status:'CANCELLED',note:b.dataset.note});closeDialog();await render();toast('Reservasi dibatalkan.');}
  };
  document.addEventListener('click',async event=>{
    const b=event.target.closest('[data-action]');if(!b)return;event.preventDefault();if(b.disabled)return;
    const action=actions[b.dataset.action];if(!action)return;
    if(b.classList.contains('btn')){const r=document.createElement('span');r.className='ripple';const bounds=b.getBoundingClientRect(),size=Math.max(bounds.width,bounds.height);r.style.width=r.style.height=size+'px';r.style.left=(event.clientX-bounds.left-size/2)+'px';r.style.top=(event.clientY-bounds.top-size/2)+'px';b.appendChild(r);setTimeout(()=>r.remove(),650);}
    b.disabled=true;try{await action(b);}catch(e){showError(e);}finally{b.disabled=false;}
  });
  document.addEventListener('change',async event=>{
    const el=event.target;
    if(el.id==='booking-city'){$('#booking-area').innerHTML=areaOptions(el.value,'');$('#booking-area').disabled=!el.value;}
    if(el.name==='coverage')updateCoverageCounts(el.closest('.coverage-picker'));
    if(el.id==='ktp-input'){$('#upload-note').textContent=el.files[0]?el.files[0].name+' · '+(el.files[0].size/1024/1024).toFixed(1)+' MB. Foto besar akan diperkecil sebelum dikirim.':'Foto hanya digunakan admin untuk verifikasi identitas.';}
    if(el.id==='availability-switch'){el.disabled=true;try{await rpc('setAvailability',{available:el.checked});state.therapistData.therapist.available=el.checked;toast(el.checked?'Anda menerima reservasi baru.':'Penerimaan reservasi baru dinonaktifkan.');}catch(e){el.checked=!el.checked;showError(e);}finally{el.disabled=false;}}
    if(el.id==='admin-filter'){state.adminFilter=el.value;renderAdminList();}
  });
  document.addEventListener('input',event=>{if(event.target.classList.contains('coverage-search'))filterCoverage(event.target.closest('.coverage-picker'),event.target.value);if(event.target.id==='admin-search'){state.adminSearch=event.target.value;renderAdminList();}});
  document.addEventListener('submit',async event=>{
    const form=event.target;event.preventDefault();if(form.dataset.busy==='true')return;if(!form.reportValidity())return;
    form.dataset.busy='true';const submit=$('[type="submit"]',form),original=submit?submit.innerHTML:'';if(submit){submit.disabled=true;submit.innerHTML='<span class="spinner"></span> Memproses…';}
    const values=Object.fromEntries(new FormData(form));const err=dialog.open?$('.dialog-error',dialog):$('#form-error');if(err)err.textContent='';
    try{
      if(form.id==='coverage-form'){await rpc('updateCoverage',{coverage:new FormData(form).getAll('coverage')});closeDialog();await render();toast('Cakupan kecamatan tersimpan.');}
      else if(form.id==='agreement-form'){await rpc('acceptAgreement',{agreementVersion:values.agreementVersion,agreementHash:values.agreementHash,agreementAccepted:values.agreementAccepted==='on',dataConsent:values.dataConsent==='on'});closeDialog();await render();toast('Persetujuan tersimpan.');}
      else if(form.id==='verification-form'){const selfie=form.elements.selfie.files[0]?await prepareKtp(form.elements.selfie.files[0]):null;const ktp=form.elements.ktp.files[0]?await prepareKtp(form.elements.ktp.files[0]):null;await rpc('submitVerification',Object.assign({},values,{requestId:form.dataset.request,selfie,ktp,agreementAccepted:values.agreementAccepted==='on',dataConsent:values.dataConsent==='on'}));closeDialog();await render();toast('Data dikirim untuk pemeriksaan admin.');}
      else if(form.id==='verification-review-form'){await rpc('reviewVerification',{verificationId:state.verification.current.id,status:values.status,note:values.note,identityChecked:values.identityChecked==='on',paymentChecked:values.paymentChecked==='on',physioVerified:state.verification.requiresCredential?values.physioVerified==='on':undefined,reactivate:values.reactivate==='on'});closeDialog();await render();toast(values.status==='APPROVED'?'Pemeriksaan disetujui. Therapist aktif.':'Hasil pemeriksaan tersimpan.');}
      else if(form.id==='service-admin-form'){await rpc('adminSaveService',Object.assign({},values,{id:form.dataset.id,active:values.active==='on',requiresCredential:values.requiresCredential==='on'}));closeDialog();state.config=await rpc('bootstrap');await render();toast('Layanan disimpan.');}
      else if(form.id==='skills-form'){await rpc('requestSkills',{skills:new FormData(form).getAll('skills')});closeDialog();await render();toast('Keahlian diajukan ke admin.');}
      else if(form.dataset.skillReview){await rpc('adminReviewSkills',{id:form.dataset.skillReview,approve:true,note:values.note,competencyChecked:values.competencyChecked==='on',credentialChecked:values.credentialChecked==='on'});await render();toast('Keahlian disetujui.');}
      else if(form.id==='addon-request-form'){const service=state.extras.services.find(s=>s.id===values.serviceId);await rpc('submitAddon',Object.assign({},values,{bookingId:state.extras.booking.id,requestId:state.extraRequestId,expectedPrice:service.price,expectedDuration:service.duration,expectedName:service.name,customerRequested:values.customerRequested==='on'}));const id=state.extras.booking.id;await render();await openInvoice(id);toast('Tambahan diajukan. Hubungi admin melalui tombol WhatsApp.');}
      else if(form.id==='base-invoice-form'){await rpc('adminBaseInvoice',{id:form.dataset.id,revision:Number(form.dataset.version),action:form.dataset.operation,amount:values.amount,note:values.note,confirmed:values.confirmed==='on'});closeDialog();await render();toast('Tagihan awal diperbarui.');}
      else if(form.id==='promo-form'){await rpc('adminSavePromo',Object.assign({},values,{id:form.dataset.id,active:values.active==='on',highlight:values.highlight==='on',serviceIds:new FormData(form).getAll('serviceIds')}));closeDialog();await render();state.config=await rpc('bootstrap');toast('Promo tersimpan.');}
      else if(form.id==='promo-code-form'){const code=values.promoCode.trim().toUpperCase();const q=await rpc('quoteBooking',Object.assign({},state.draft,{promoCode:code}));state.promoCode=code;state.quote=q;await render();toast('Harga diperbarui.');}
      else if(form.id==='signup-username-form'){signupUsername=values.username.trim().toLowerCase();closeDialog();state.mode='therapist';await render();}
      else if(form.id==='therapist-login-form'){const info=await rpc('therapistLoginInfo',{username:values.username});const proof=await passwordProof(values.password,info.salt);const r=await rpc('therapistLogin',{username:values.username,proof,remember:values.remember==='on'});setToken(r.token,values.remember==='on');state.user=r.user;signupUsername='';closeDialog();await render();toast('Berhasil masuk.');}
      else if(form.id==='therapist-access-form'){if(values.password.length<15)throw new Error('Password minimal 15 karakter.');const proof=await passwordProof(values.password,credentialTicket.salt);const result=await rpc('adminSetCredential',Object.assign({},credentialTicket,{therapistId:form.dataset.id,username:values.username,proof}));const message='Akses therapist Massage di Onlineaja\nUsername: '+result.username+'\nPassword: '+values.password+'\nBuka website lalu pilih Untuk therapist → Masuk. Simpan pesan ini dan jangan bagikan ke orang lain.';credentialTicket=null;await render();openDialog('Akses berhasil disimpan',`<p class="dialog-copy">Salin sekarang dan kirim secara pribadi ke WhatsApp therapist yang terverifikasi. Password tidak dapat dilihat lagi setelah jendela ini ditutup.</p><textarea id="credentials-once" readonly rows="7">${escape(message)}</textarea><button class="btn" data-action="copy-credentials">Salin akses</button>`);}
      else if(form.id==='admin-therapist-profile-form'){await rpc('adminEditTherapistProfile',Object.assign({},values,{therapistId:form.dataset.id,updatedAt:form.dataset.updated,coverage:new FormData(form).getAll('coverage'),identityChecked:values.identityChecked==='on'}));closeDialog();await render();toast('Profil diperbarui oleh admin.');}
      else if(form.id==='login-email-form'){loginEmail=values.email.trim().toLowerCase();await rpc('requestOtp',{email:loginEmail});openOtp();}
      else if(form.id==='login-otp-form'){const r=await rpc('verifyOtp',{email:loginEmail,code:values.code});setToken(r.token);state.user=r.user;closeDialog();renderAccount();const next=afterLogin;afterLogin=null;if(next)await next();else await render();toast('Berhasil masuk.');}
      else if(form.id==='profile-form'){state.user=await rpc('saveProfile',values);closeDialog();renderAccount();const next=afterLogin;afterLogin=null;if(next)await next();else await render();toast('Profil disimpan.');}
      else if(form.id==='schedule-form'){Object.assign(state.draft,{city:values.city,area:values.area,date:values.date,time:values.time,address:values.address.trim(),notes:values.notes.trim()});state.selectedTherapist=null;state.therapists=await rpc('findTherapists',state.draft);state.step=2;await render();}
      else if(form.id==='booking-confirm-form'){
        // Buka jendela dari gestur pengguna agar checkout tidak diblokir popup browser.
        let popup=null;if(!window.MASSAGE_DEMO){popup=window.open('about:blank','_blank');if(popup){popup.opener=null;try{popup.document.body.textContent='Menyiapkan reservasi dan WhatsApp…';}catch(e){}}}
        try{state.booking=await rpc('createBooking',Object.assign({},state.draft,{therapistId:state.selectedTherapist.id,consent:values.consent==='on',promoCode:state.promoCode,quoteKey:state.quote && state.quote.quoteKey}));await render();if(popup&&!popup.closed)popup.location.href=state.booking.whatsappUrl;}catch(e){if(popup&&!popup.closed)popup.close();if(e.code==='PRICE_CHANGED'){state.quote=await rpc('quoteBooking',Object.assign({},state.draft,{promoCode:state.promoCode}));await render();}throw e;}
      }
      else if(form.id==='therapist-form'){
        const skills=new FormData(form).getAll('skills'),coverage=new FormData(form).getAll('coverage');if(!skills.length)throw new Error('Pilih setidaknya satu keahlian.');if(!coverage.length)throw new Error('Pilih setidaknya satu kecamatan layanan.');
        if(submit)submit.innerHTML='<span class="spinner"></span> Menyiapkan foto…';const ktp=await prepareKtp($('#ktp-input').files[0]);const selfie=await prepareKtp(form.elements.selfie.files[0]);if(submit)submit.innerHTML='<span class="spinner"></span> Mengirim pendaftaran…';
        const registration=await rpc(signupUsername&&!state.user?'publicTherapistApplication':'registerTherapist',{username:signupUsername||values.username,email:values.email,fullName:values.fullName,whatsapp:values.whatsapp,experience:values.experience,skills,coverage,ktp,selfie,consent:values.dataConsent==='on',requestId:form.dataset.request,paymentType:values.paymentType,provider:values.provider,accountNumber:values.accountNumber,accountName:values.accountName,agreementVersion:values.agreementVersion,agreementHash:values.agreementHash,agreementAccepted:values.agreementAccepted==='on',dataConsent:values.dataConsent==='on'});if(registration.token){setToken(registration.token);state.user=registration.user;signupUsername='';}else state.user.isTherapist=true;await render();toast('Pendaftaran berhasil. Tunggu pemeriksaan admin.');
      }
      else if(form.id==='review-form'){if(!state.rating)throw new Error('Pilih jumlah bintang terlebih dahulu.');await rpc('submitReview',{bookingId:form.dataset.id,rating:state.rating,comment:values.comment});closeDialog();await render();toast('Terima kasih. Review Anda sudah tersimpan.');}
    }catch(e){showError(e);}finally{form.dataset.busy='false';if(submit){submit.disabled=false;submit.innerHTML=original;}}
  });
  document.querySelector('.brand').addEventListener('click',e=>{e.preventDefault();state.mode='customer';render();});
  function startupRequest(promise, waitMs = 15000) {
    return new Promise((resolve,reject) => {
      const timer=setTimeout(()=>reject(new Error('Halaman belum berhasil tersambung. Coba muat ulang atau buka URL website melalui browser.')),waitMs);
      promise.then(value=>{clearTimeout(timer);resolve(value);},error=>{clearTimeout(timer);reject(error);});
    });
  }
  async function boot(){
    try{state.config=await startupRequest(rpc('bootstrap'));if(state.config.services.length){state.draft.serviceId=state.config.services[0].id;state.draft.serviceName=state.config.services[0].name;}
      if(state.token){try{state.user=await startupRequest(rpc('me'));}catch(e){setToken('');}}
      if(window.MASSAGE_DEMO && $('.mode-switch').querySelector('a')) $('.mode-switch').innerHTML='<button type="button" data-action="mode" data-value="customer" class="active" aria-pressed="true">Untuk customer</button><button type="button" data-action="mode" data-value="therapist" aria-pressed="false">Untuk therapist</button>';
      $('#boot-status').hidden=true;$('#app').hidden=false;await render();
      if(window.MASSAGE_DEMO){$('#preview-banner').hidden=false;$('#preview-banner').innerHTML='PRATINJAU INTERAKTIF · Data contoh, tidak terhubung ke Google Sheets. Jangan gunakan data/KTP asli. OTP contoh: 123456. Login therapist: sari.contoh / ContohTherapist234.<div class="demo-controls"><button id="demo-customer">Contoh customer</button><button id="demo-therapist">Contoh therapist</button><button id="demo-admin">Contoh admin</button><button id="demo-register">Contoh pendaftaran</button></div>';['customer','therapist','admin','register'].forEach(role=>$('#demo-'+role).addEventListener('click',async()=>{const r=window.MASSAGE_DEMO.loginAs(role);state.user=r.user;setToken(r.token);state.mode=role==='admin'?'admin':['therapist','register'].includes(role)?'therapist':'customer';state.step=0;state.booking=null;state.tab='new';await render();}));}
    }catch(e){
      if(previewFallback){
        $('#app').innerHTML=previewFallback;$('#app').hidden=false;$('#boot-status').hidden=true;
        $('#preview-banner').hidden=false;$('#preview-banner').textContent='PRATINJAU DESAIN · Mode interaktif belum dapat berjalan. Desain tetap bisa dilihat di bawah.';
      } else {
        $('#boot-status').hidden=false;$('#boot-status').innerHTML=notice(escape(e.message),'error')+'<button class="btn btn-outline" id="retry-boot">Coba lagi</button>';$('#retry-boot').addEventListener('click',boot);
      }
    }
  }
  let bannerTimer=null;
  function refreshBannerClock(){clearTimeout(bannerTimer);if(!state.config)return;const el=$('#promo-highlights');if(el)el.innerHTML=highlightBanner();const ends=(state.config&&state.config.highlights||[]).map(p=>+new Date(p.endsAt)).filter(n=>n>Date.now());if(ends.length)bannerTimer=setTimeout(refreshBannerClock,Math.min(2147483647,Math.max(50,Math.min(...ends)-Date.now()+25)));}
  document.addEventListener('visibilitychange',async()=>{if(document.hidden||!state.config)return;try{const latest=await rpc('bootstrap');state.config.highlights=latest.highlights||[];refreshBannerClock();}catch(e){}});
  async function pollHighlights(){
    if(state.config&&state.config.configured&&!document.hidden&&state.mode==='customer'){try{const data=await rpc('bootstrap');state.config.highlights=data.highlights||[];refreshBannerClock();}catch(e){}}
    setTimeout(pollHighlights,60000);
  }
  boot().then(()=>{refreshBannerClock();setTimeout(pollHighlights,60000);});
})();
</script>
